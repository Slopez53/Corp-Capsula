<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mis Ventas</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --fs: 16px;
  --accent: #e94560;
  --bg: #1a1a2e;
  --card: #16213e;
  --card2: #0f3460;
  --text: #eaeaea;
  --muted: #8899aa;
  --green: #00b894;
  --yellow: #fdcb6e;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: var(--fs);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
  background: var(--card);
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 2px solid var(--accent);
}
.hdr h1 { font-size: 1.1em; font-weight: 700; }
.hdr-date { font-size: 0.8em; color: var(--muted); }
#app { flex: 1; overflow-y: auto; padding: 14px 12px 90px; }
nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--card);
  display: flex;
  border-top: 1px solid #2a2a5e;
  z-index: 20;
}
nav button {
  flex: 1;
  border: none;
  background: none;
  color: var(--muted);
  padding: 10px 4px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 0.72em;
  cursor: pointer;
  transition: color .2s;
}
nav button.active { color: var(--accent); }
nav button .ico { font-size: 1.6em; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 0.78em;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 10px;
  font-weight: 600;
}
input, select, textarea {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid #2a2a5e;
  border-radius: 10px;
  color: var(--text);
  font-size: 1em;
  padding: 12px 14px;
  outline: none;
  -webkit-appearance: none;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--muted); }
textarea { resize: none; height: 70px; }
.input-row { margin-bottom: 10px; }
.input-label { font-size: 0.82em; color: var(--muted); margin-bottom: 5px; display: block; }
.btn {
  border: none;
  border-radius: 10px;
  padding: 13px 18px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: opacity .15s;
  font-family: inherit;
}
.btn:active { opacity: 0.7; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--card2); color: var(--text); }
.btn-green { background: var(--green); color: #fff; }
.btn-sm {
  padding: 8px 14px;
  font-size: 0.88em;
  border-radius: 8px;
  width: auto;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
}
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
}
.stat-val { font-size: 1.35em; font-weight: 700; color: var(--accent); }
.stat-lbl { font-size: 0.75em; color: var(--muted); margin-top: 3px; }
.venta-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  border-left: 3px solid var(--accent);
  cursor: pointer;
  transition: opacity .15s;
}
.venta-item:active { opacity: 0.75; }
.venta-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.venta-cliente { font-weight: 700; }
.venta-total { font-weight: 700; color: var(--green); font-size: 1.05em; }
.venta-hora { font-size: 0.78em; color: var(--muted); }
.venta-prods { font-size: 0.83em; color: var(--muted); margin-top: 4px; }
.prod-row {
  display: grid;
  grid-template-columns: 1fr 68px 88px 38px;
  gap: 6px;
  align-items: center;
  margin-bottom: 8px;
}
.prod-row select,
.prod-row input {
  padding: 10px 8px;
  font-size: 0.9em;
}
.del-btn {
  border: none;
  background: #3a0020;
  color: #ff6b8a;
  border-radius: 8px;
  padding: 0;
  font-size: 1em;
  cursor: pointer;
  height: 42px;
  width: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bar-lbl { width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.82em; }
.bar-wrap { flex: 1; height: 10px; background: #2a2a5e; border-radius: 6px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; background: var(--accent); transition: width .4s; }
.bar-fill.b2 { background: transparent; border: 1.5px solid var(--accent); }
.bar-val { min-width: 36px; text-align: right; font-size: 0.8em; color: var(--muted); }
.cliente-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
}
.ajuste-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #2a2a5e;
}
.ajuste-row:last-child { border-bottom: none; }
.ajuste-lbl { font-weight: 500; }
.ajuste-sub { font-size: 0.8em; color: var(--muted); margin-top: 2px; }
.fs-btns { display: flex; gap: 6px; }
.fs-btn {
  border: 1.5px solid #2a2a5e;
  background: none;
  color: var(--text);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-family: inherit;
  transition: border-color .2s, background .2s;
}
.fs-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.prod-cat-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #2a2a5e;
  font-size: 0.9em;
}
.prod-cat-item:last-child { border-bottom: none; }
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--green);
  color: #fff;
  padding: 10px 24px;
  border-radius: 30px;
  font-weight: 600;
  font-size: 0.9em;
  opacity: 0;
  transition: opacity .3s, transform .3s;
  z-index: 100;
  pointer-events: none;
  white-space: nowrap;
  max-width: 90vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 50;
  align-items: flex-end;
  justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--card);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 20px 16px 34px;
  width: 100%;
  max-width: 480px;
  max-height: 88dvh;
  overflow-y: auto;
}
.modal-title { font-size: 1.05em; font-weight: 700; margin-bottom: 14px; }
.modal-close {
  float: right;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.4em;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9em; line-height: 1.8; }
.empty-ico { font-size: 3em; margin-bottom: 10px; }
.filter-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
.filter-tab {
  border: 1.5px solid #2a2a5e;
  background: none;
  color: var(--muted);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.85em;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  flex-shrink: 0;
}
.filter-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(233,69,96,.1); }
.section-title { font-size: 1em; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.badge { background: var(--accent); color: #fff; border-radius: 20px; padding: 2px 9px; font-size: 0.78em; }
.compare-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.compare-tab {
  flex: 1;
  border: 1.5px solid #2a2a5e;
  background: none;
  color: var(--muted);
  border-radius: 20px;
  padding: 8px;
  font-size: 0.85em;
  cursor: pointer;
  font-family: inherit;
  text-align: center;
}
.compare-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(233,69,96,.1); }
.delta-pos { color: var(--green); font-weight: 700; }
.delta-neg { color: var(--accent); font-weight: 700; }
.export-area {
  background: var(--bg);
  border-radius: 10px;
  padding: 12px;
  font-size: 0.82em;
  color: var(--muted);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 220px;
  overflow-y: auto;
  margin-bottom: 10px;
  line-height: 1.6;
  border: 1px solid #2a2a5e;
}
.resumen-prod {
  display: flex;
  justify-content: space-between;
  font-size: 0.9em;
  padding: 6px 0;
  border-bottom: 1px solid #2a2a5e;
}
.resumen-total {
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  font-size: 1.05em;
  padding: 10px 0 4px;
}
.tag {
  display: inline-block;
  background: var(--card2);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 0.78em;
  color: var(--muted);
}
.total-bar {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.total-bar-val { font-weight: 700; color: var(--green); font-size: 1.1em; }
.total-bar-sub { font-size: 0.82em; color: var(--muted); }
.add-row { display: flex; gap: 8px; margin-top: 10px; }
.add-row input { flex: 1; }
select option { background: #1a1a2e; }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>🥩 Mis Ventas</h1>
    <div class="hdr-date" id="hdr-date"></div>
  </div>
  <div style="font-size:1.5em">💰</div>
</div>

<div id="app"></div>

<nav>
  <button class="active" id="nav-venta" onclick="goTo('venta')">
    <span class="ico">➕</span>Nueva
  </button>
  <button id="nav-hoy" onclick="goTo('hoy')">
    <span class="ico">📅</span>Hoy
  </button>
  <button id="nav-ventas" onclick="goTo('ventas')">
    <span class="ico">📋</span>Ventas
  </button>
  <button id="nav-informe" onclick="goTo('informe')">
    <span class="ico">📊</span>Informe
  </button>
  <button id="nav-ajustes" onclick="goTo('ajustes')">
    <span class="ico">⚙️</span>Ajustes
  </button>
</nav>

<div class="toast" id="toast"></div>

<!-- Modal detalle venta -->
<div class="modal-bg" id="modal-detalle" onclick="bgClose(event,'modal-detalle')">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-detalle')">✕</button>
    <div class="modal-title">Detalle de Venta</div>
    <div id="modal-detalle-body"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-secondary" style="font-size:0.9em" onclick="compartirVenta()">📤 Compartir</button>
      <button class="btn btn-primary" style="font-size:0.9em;background:#b71c1c" onclick="pedirEliminar()">🗑️ Eliminar</button>
    </div>
  </div>
</div>

<!-- Modal exportar texto -->
<div class="modal-bg" id="modal-export" onclick="bgClose(event,'modal-export')">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-export')">✕</button>
    <div class="modal-title">📤 Compartir</div>
    <div class="export-area" id="export-text"></div>
    <button class="btn btn-primary" onclick="copiarTexto()">📋 Copiar texto</button>
  </div>
</div>

<script>
// ─── BASE DE DATOS ────────────────────────────────────────────────────────────
let DB = {
  ventas: [],
  config: { fontSize: 'medium', moneda: '$' },
  productos: ['Salchichas','Chorizo','Jamón','Mortadela','Salami','Tocino','Longaniza','Butifarra'],
  clientes: []
};

// ─── ESTADO UI ────────────────────────────────────────────────────────────────
let paginaActual = 'venta';
let ventaSelId = null;
let filtroVentas = 'hoy';
let busqueda = '';
let compareMode = 'semanas';
let infPersonalizado = { desde1: '', hasta1: '', desde2: '', hasta2: '' };
let exportTextoActual = '';

// Formulario de nueva venta (persiste entre re-renders)
let vForm = {
  cliente: '',
  nota: '',
  items: [{ prod: '', cant: 1, precio: '', custom: false }]
};

// ─── PERSISTENCIA ─────────────────────────────────────────────────────────────
function guardar() {
  try {
    localStorage.setItem('embutidos_v2', JSON.stringify(DB));
  } catch (e) {
    toast('Almacenamiento lleno, borra datos antiguos', 'red');
  }
}

function cargar() {
  try {
    const raw = localStorage.getItem('embutidos_v2');
    if (!raw) return;
    const p = JSON.parse(raw);
    DB.ventas    = Array.isArray(p.ventas)    ? p.ventas    : [];
    DB.clientes  = Array.isArray(p.clientes)  ? p.clientes  : [];
    DB.productos = Array.isArray(p.productos) && p.productos.length ? p.productos : DB.productos;
    DB.config    = { ...DB.config, ...(p.config || {}) };
  } catch (e) {
    console.error('Error cargando datos', e);
  }
}

// ─── UTILIDADES ───────────────────────────────────────────────────────────────
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function hoy() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function isoDate(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function fmt(n) {
  return DB.config.moneda + (Number(n) || 0).toLocaleString('es-CO');
}

// Escapa HTML para prevenir inyección
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtFecha(d) {
  if (!d) return '';
  const parts = d.split('-');
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}

function fmtHora(ts) {
  if (!ts) return '';
  try { return new Date(ts).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ''; }
}

function toast(msg, tipo) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.style.background = tipo === 'red' ? 'var(--accent)' : 'var(--green)';
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function openModal(id) {
  const m = document.getElementById(id);
  if (m) m.classList.add('open');
}

function closeModal(id) {
  const m = document.getElementById(id);
  if (m) m.classList.remove('open');
}

function bgClose(e, id) {
  if (e.target === e.currentTarget) closeModal(id);
}

// ─── FONT SIZE ────────────────────────────────────────────────────────────────
const FS = { small: '14px', medium: '16px', large: '19px' };
function aplicarFS() {
  document.documentElement.style.setProperty('--fs', FS[DB.config.fontSize] || '16px');
}

// ─── FECHAS ───────────────────────────────────────────────────────────────────
function semanaActual() {
  const d = new Date();
  const offset = (d.getDay() + 6) % 7; // lunes = 0
  const lun = new Date(d); lun.setDate(d.getDate() - offset);
  const dom = new Date(lun); dom.setDate(lun.getDate() + 6);
  return [isoDate(lun), isoDate(dom)];
}

function semanaPasada() {
  const [lun] = semanaActual();
  const l = new Date(lun); l.setDate(l.getDate() - 7);
  const d2 = new Date(l); d2.setDate(l.getDate() + 6);
  return [isoDate(l), isoDate(d2)];
}

function mesActual() {
  const d = new Date();
  const desde = new Date(d.getFullYear(), d.getMonth(), 1);
  const hasta  = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return [isoDate(desde), isoDate(hasta)];
}

function mesPasado() {
  const d = new Date();
  const desde = new Date(d.getFullYear(), d.getMonth() - 1, 1);
  const hasta  = new Date(d.getFullYear(), d.getMonth(), 0);
  return [isoDate(desde), isoDate(hasta)];
}

// ─── NAVEGACIÓN ───────────────────────────────────────────────────────────────
function goTo(pagina) {
  leerFormVenta(); // sincronizar estado antes de salir
  paginaActual = pagina;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('nav-' + pagina);
  if (btn) btn.classList.add('active');
  render();
}

// ─── NUEVA VENTA: SINCRONIZACIÓN DOM → ESTADO ─────────────────────────────────
function leerFormVenta() {
  if (paginaActual !== 'venta') return;
  const cl = document.getElementById('input-cliente');
  const nt = document.getElementById('input-nota');
  if (cl) vForm.cliente = cl.value;
  if (nt) vForm.nota = nt.value;
  // los items se sincronizan en tiempo real con oninput
}

// ─── NUEVA VENTA: FILAS DE PRODUCTOS ──────────────────────────────────────────
function htmlFilasProductos() {
  return vForm.items.map((it, i) => {
    const selOpts = DB.productos.map(p =>
      `<option value="${esc(p)}" ${it.prod === p ? 'selected' : ''}>${esc(p)}</option>`
    ).join('');

    const campoProd = it.custom
      ? `<input type="text" placeholder="Escribe el producto" value="${esc(it.prod)}"
           style="padding:10px 8px;font-size:0.9em"
           oninput="vForm.items[${i}].prod=this.value">`
      : `<select style="padding:10px 8px;font-size:0.9em"
           onchange="cambiarProdSel(${i},this)">
           <option value="">— Producto —</option>
           ${selOpts}
           <option value="__otro">Otro (escribir)...</option>
         </select>`;

    const delBtn = vForm.items.length > 1
      ? `<button class="del-btn" onclick="quitarFila(${i})" aria-label="Quitar">✕</button>`
      : `<div style="width:38px"></div>`;

    return `<div class="prod-row">
      ${campoProd}
      <input type="number" inputmode="numeric" min="1" placeholder="Cant"
        value="${esc(String(it.cant))}" style="padding:10px 8px;font-size:0.9em"
        oninput="vForm.items[${i}].cant=Math.max(1,+this.value||1);calcTotal()">
      <input type="number" inputmode="decimal" min="0" placeholder="Precio"
        value="${esc(String(it.precio))}" style="padding:10px 8px;font-size:0.9em"
        oninput="vForm.items[${i}].precio=+this.value||0;calcTotal()">
      ${delBtn}
    </div>`;
  }).join('');
}

function cambiarProdSel(i, sel) {
  if (sel.value === '__otro') {
    vForm.items[i].prod = '';
    vForm.items[i].custom = true;
  } else {
    vForm.items[i].prod = sel.value;
    vForm.items[i].custom = false;
  }
  // Solo re-renderiza las filas, no toda la página
  refrescarFilas();
  calcTotal();
}

function refrescarFilas() {
  const el = document.getElementById('prod-rows');
  if (el) el.innerHTML = htmlFilasProductos();
}

function agregarFila() {
  vForm.items.push({ prod: '', cant: 1, precio: '', custom: false });
  refrescarFilas();
  // Scroll al nuevo row
  const rows = document.querySelectorAll('#prod-rows .prod-row');
  const last = rows[rows.length - 1];
  if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function quitarFila(i) {
  if (vForm.items.length <= 1) return;
  vForm.items.splice(i, 1);
  refrescarFilas();
  calcTotal();
}

function calcTotal() {
  const total = vForm.items.reduce((s, it) => s + ((+it.cant || 0) * (+it.precio || 0)), 0);
  const el = document.getElementById('total-preview');
  if (el) el.textContent = fmt(total);
}

function renderVenta() {
  const total = vForm.items.reduce((s, it) => s + ((+it.cant || 0) * (+it.precio || 0)), 0);
  const cliOpts = DB.clientes.map(c => `<option value="${esc(c)}">`).join('');
  const tieneDatos = vForm.items.some(it => it.prod || it.precio) || vForm.cliente;

  return `
    <div class="card">
      <div class="card-title">Cliente</div>
      <input list="cli-dl" id="input-cliente" placeholder="Nombre del cliente"
        value="${esc(vForm.cliente)}" autocomplete="off"
        oninput="vForm.cliente=this.value">
      <datalist id="cli-dl">${cliOpts}</datalist>
    </div>

    <div class="card">
      <div class="card-title">Productos vendidos</div>
      <div id="prod-rows">${htmlFilasProductos()}</div>
      <button class="btn btn-secondary" style="margin-top:8px" onclick="agregarFila()">＋ Agregar producto</button>
    </div>

    <div class="card">
      <div class="card-title">Nota (opcional)</div>
      <textarea id="input-nota" placeholder="Pago con transferencia, deuda pendiente..."
        oninput="vForm.nota=this.value">${esc(vForm.nota)}</textarea>
    </div>

    <div class="stat" style="background:var(--card);margin-bottom:12px">
      <div class="stat-val" id="total-preview">${fmt(total)}</div>
      <div class="stat-lbl">Total de esta venta</div>
    </div>

    <button class="btn btn-primary" onclick="guardarVenta()">✅ Guardar Venta</button>
    ${tieneDatos ? `<button class="btn btn-secondary" style="margin-top:8px;color:var(--muted);font-size:0.9em"
      onclick="limpiarVentaForm()">🗑️ Limpiar formulario</button>` : ''}
  `;
}

function limpiarVentaForm() {
  if (!confirm('¿Limpiar el formulario?')) return;
  vForm = { cliente: '', nota: '', items: [{ prod: '', cant: 1, precio: '', custom: false }] };
  render();
}

function guardarVenta() {
  leerFormVenta();

  const cliente = vForm.cliente.trim() || 'Sin nombre';
  const nota    = vForm.nota.trim();

  const items = vForm.items
    .filter(it => it.prod && it.prod.trim() && (+it.precio) > 0)
    .map(it => ({
      prod:   it.prod.trim(),
      cant:   Math.max(1, Math.round(+it.cant) || 1),
      precio: Math.round(+it.precio)
    }));

  if (!items.length) {
    toast('Agrega al menos un producto con precio mayor a 0', 'red');
    return;
  }

  const total = items.reduce((s, it) => s + it.cant * it.precio, 0);

  DB.ventas.unshift({
    id:      uid(),
    fecha:   hoy(),
    ts:      Date.now(),
    cliente,
    nota,
    items,
    total
  });

  if (cliente !== 'Sin nombre' && !DB.clientes.includes(cliente)) {
    DB.clientes.push(cliente);
  }
  items.forEach(it => {
    if (!DB.productos.includes(it.prod)) DB.productos.push(it.prod);
  });

  guardar();

  vForm = { cliente: '', nota: '', items: [{ prod: '', cant: 1, precio: '', custom: false }] };
  toast('¡Venta guardada! ' + fmt(total));
  goTo('hoy');
}

// ─── HOY ──────────────────────────────────────────────────────────────────────
function renderHoy() {
  const ventasHoy = DB.ventas.filter(v => v.fecha === hoy());
  const total     = ventasHoy.reduce((s, v) => s + v.total, 0);
  const cli       = [...new Set(ventasHoy.map(v => v.cliente))];

  const contProds = {};
  ventasHoy.forEach(v => v.items.forEach(it => {
    contProds[it.prod] = (contProds[it.prod] || 0) + it.cant;
  }));
  const top = Object.entries(contProds).sort((a, b) => b[1] - a[1]).slice(0, 5);

  return `
    <div class="stats">
      <div class="stat"><div class="stat-val">${fmt(total)}</div><div class="stat-lbl">Total hoy</div></div>
      <div class="stat"><div class="stat-val">${ventasHoy.length}</div><div class="stat-lbl">Ventas</div></div>
      <div class="stat"><div class="stat-val">${cli.length}</div><div class="stat-lbl">Clientes</div></div>
      <div class="stat"><div class="stat-val">${Object.keys(contProds).length}</div><div class="stat-lbl">Productos</div></div>
    </div>

    ${top.length ? `<div class="card">
      <div class="card-title">Más vendido hoy</div>
      ${top.map(([p, c]) => `
        <div class="prod-cat-item">
          <span>${esc(p)}</span><span class="tag">×${c}</span>
        </div>`).join('')}
    </div>` : ''}

    <div class="section-title">
      Ventas de hoy${ventasHoy.length ? ` <span class="badge">${ventasHoy.length}</span>` : ''}
    </div>
    ${ventasHoy.length
      ? ventasHoy.map(v => htmlVentaCard(v)).join('')
      : '<div class="empty"><div class="empty-ico">📭</div>Sin ventas hoy<br>Toca ➕ para registrar</div>'}

}

// ─── LISTA VENTAS ─────────────────────────────────────────────────────────────
function filtrarVentas() {
  let lista = [...DB.ventas];
  if (busqueda) {
    return lista.filter(v => v.cliente.toLowerCase().includes(busqueda.toLowerCase()));
  }
  if (filtroVentas === 'hoy')    return lista.filter(v => v.fecha === hoy());
  if (filtroVentas === 'semana') { const [l, d] = semanaActual(); return lista.filter(v => v.fecha >= l && v.fecha <= d); }
  if (filtroVentas === 'mes')    { const [l, d] = mesActual();    return lista.filter(v => v.fecha >= l && v.fecha <= d); }
  return lista;
}

function renderVentas() {
  const lista  = filtrarVentas();
  const total  = lista.reduce((s, v) => s + v.total, 0);
  const cliOpts = DB.clientes.map(c => `<option value="${esc(c)}">`).join('');

  return `
    <div class="input-row">
      <input type="search" list="cli-search-dl" id="busqueda-input"
        placeholder="🔍 Buscar por cliente..."
        value="${esc(busqueda)}"
        oninput="busqueda=this.value;actualizarListaVentas()">
      <datalist id="cli-search-dl">${cliOpts}</datalist>
    </div>

    <div class="filter-tabs">
      ${['hoy','semana','mes','todo'].map(f =>
        `<button class="filter-tab ${filtroVentas===f&&!busqueda?'active':''}" onclick="setFiltro('${f}')">${
          {hoy:'Hoy',semana:'Semana',mes:'Mes',todo:'Todo'}[f]
        }</button>`
      ).join('')}
    </div>

    ${lista.length ? `
    <div class="total-bar">
      <div><div class="total-bar-val">${fmt(total)}</div><div class="total-bar-sub">${lista.length} venta${lista.length!==1?'s':''}</div></div>
      <button class="btn-sm btn-secondary" onclick="exportarLista()">📤</button>
    </div>` : ''}

    <div id="lista-ventas">
      ${lista.length ? lista.map(v => htmlVentaCard(v)).join('') : '<div class="empty"><div class="empty-ico">📭</div>No hay ventas en este período</div>'}
    </div>
  `;
}

function setFiltro(f) {
  filtroVentas = f;
  busqueda = '';
  goTo('ventas');
}

function actualizarListaVentas() {
  busqueda = document.getElementById('busqueda-input')?.value || '';
  const lista = filtrarVentas();
  const el = document.getElementById('lista-ventas');
  if (el) el.innerHTML = lista.length
    ? lista.map(v => htmlVentaCard(v)).join('')
    : '<div class="empty"><div class="empty-ico">📭</div>No hay resultados</div>';
}

function htmlVentaCard(v) {
  const prodsStr = v.items.map(it => esc(it.prod) + ' ×' + it.cant).join(', ');
  return `<div class="venta-item" onclick="verDetalle('${esc(v.id)}')">
    <div class="venta-top">
      <span class="venta-cliente">👤 ${esc(v.cliente)}</span>
      <span class="venta-total">${fmt(v.total)}</span>
    </div>
    <div class="venta-hora">${fmtFecha(v.fecha)} · ${fmtHora(v.ts)}</div>
    <div class="venta-prods">${prodsStr}</div>
  </div>`;
}

// ─── DETALLE VENTA ────────────────────────────────────────────────────────────
function verDetalle(id) {
  const v = DB.ventas.find(x => x.id === id);
  if (!v) { toast('Venta no encontrada', 'red'); return; }
  ventaSelId = id;

  const body = document.getElementById('modal-detalle-body');
  body.innerHTML = '';

  // Usar textContent / appendChild para evitar XSS
  const encabezado = document.createElement('div');
  encabezado.style.marginBottom = '12px';

  const nombre = document.createElement('div');
  nombre.style.cssText = 'font-size:1.05em;font-weight:700;margin-bottom:2px';
  nombre.textContent = '👤 ' + v.cliente;

  const fecha = document.createElement('div');
  fecha.style.cssText = 'color:var(--muted);font-size:0.82em';
  fecha.textContent = fmtFecha(v.fecha) + ' · ' + fmtHora(v.ts);

  encabezado.appendChild(nombre);
  encabezado.appendChild(fecha);
  body.appendChild(encabezado);

  v.items.forEach(it => {
    const fila = document.createElement('div');
    fila.className = 'resumen-prod';

    const izq = document.createElement('span');
    izq.textContent = it.prod + ' ×' + it.cant;

    const der = document.createElement('span');
    der.textContent = fmt(it.cant * it.precio);

    fila.appendChild(izq);
    fila.appendChild(der);
    body.appendChild(fila);
  });

  const totalRow = document.createElement('div');
  totalRow.className = 'resumen-total';

  const tLbl = document.createElement('span');
  tLbl.textContent = 'Total';

  const tVal = document.createElement('span');
  tVal.style.color = 'var(--green)';
  tVal.textContent = fmt(v.total);

  totalRow.appendChild(tLbl);
  totalRow.appendChild(tVal);
  body.appendChild(totalRow);

  if (v.nota) {
    const nota = document.createElement('div');
    nota.style.cssText = 'margin-top:10px;font-size:0.85em;color:var(--muted)';
    nota.textContent = '📝 ' + v.nota;
    body.appendChild(nota);
  }

  openModal('modal-detalle');
}

function compartirVenta() {
  const v = DB.ventas.find(x => x.id === ventaSelId);
  if (!v) return;

  const lineas = [
    '📦 VENTA - ' + fmtFecha(v.fecha),
    '👤 Cliente: ' + v.cliente,
    '⏰ Hora: ' + fmtHora(v.ts),
    '',
    ...v.items.map(it => '• ' + it.prod + ' ×' + it.cant + ' = ' + fmt(it.cant * it.precio)),
    '',
    '💰 TOTAL: ' + fmt(v.total),
    ...(v.nota ? ['📝 ' + v.nota] : [])
  ];
  const texto = lineas.join('\n');

  if (navigator.share) {
    navigator.share({ text: texto, title: 'Venta ' + v.cliente }).catch(() => {});
  } else {
    mostrarExport(texto);
    closeModal('modal-detalle');
  }
}

function pedirEliminar() {
  const v = DB.ventas.find(x => x.id === ventaSelId);
  if (!v) return;
  if (!confirm('¿Eliminar la venta de ' + v.cliente + ' (' + fmt(v.total) + ')?')) return;
  DB.ventas = DB.ventas.filter(x => x.id !== ventaSelId);
  guardar();
  closeModal('modal-detalle');
  toast('Venta eliminada', 'red');
  render();
}

function exportarLista() {
  const lista = filtrarVentas();
  if (!lista.length) { toast('No hay ventas para exportar', 'red'); return; }
  const total = lista.reduce((s, v) => s + v.total, 0);
  const lineas = [
    '📋 REGISTRO DE VENTAS',
    '─────────────────────',
    ...lista.map(v =>
      fmtFecha(v.fecha) + ' ' + fmtHora(v.ts) + '\n' +
      '  👤 ' + v.cliente + ' → ' + fmt(v.total) + '\n' +
      '  ' + v.items.map(it => it.prod + ' ×' + it.cant).join(', ')
    ),
    '─────────────────────',
    '💰 TOTAL: ' + fmt(total),
    '🧾 Ventas: ' + lista.length
  ];
  mostrarExport(lineas.join('\n'));
}

// ─── INFORME ──────────────────────────────────────────────────────────────────
function ventasRango(desde, hasta) {
  return DB.ventas.filter(v => v.fecha >= desde && v.fecha <= hasta);
}

function estadisticas(ventas) {
  const total = ventas.reduce((s, v) => s + v.total, 0);
  const clientes = [...new Set(ventas.map(v => v.cliente))];
  const prods = {};
  ventas.forEach(v => v.items.forEach(it => {
    prods[it.prod] = (prods[it.prod] || 0) + it.cant;
  }));
  return { total, count: ventas.length, clientes, prods };
}

let _reporteActual = { lbl: '', desde: '', hasta: '' };

function renderInforme() {
  let r1, r2, lbl1, lbl2;

  if (compareMode === 'semanas') {
    r1 = semanaActual();  r2 = semanaPasada();
    lbl1 = 'Esta semana'; lbl2 = 'Semana pasada';
  } else if (compareMode === 'meses') {
    r1 = mesActual();   r2 = mesPasado();
    lbl1 = 'Este mes';  lbl2 = 'Mes pasado';
  } else {
    r1 = [infPersonalizado.desde1 || hoy(), infPersonalizado.hasta1 || hoy()];
    r2 = [infPersonalizado.desde2 || hoy(), infPersonalizado.hasta2 || hoy()];
    lbl1 = 'Período 1'; lbl2 = 'Período 2';
  }

  _reporteActual = { lbl: lbl1, desde: r1[0], hasta: r1[1] };

  const v1 = ventasRango(r1[0], r1[1]);
  const v2 = ventasRango(r2[0], r2[1]);
  const e1 = estadisticas(v1);
  const e2 = estadisticas(v2);

  const delta = e2.total > 0 ? Math.round((e1.total - e2.total) / e2.total * 100) : null;

  const todosProds = [...new Set([...Object.keys(e1.prods), ...Object.keys(e2.prods)])].slice(0, 7);
  const maxP = Math.max(1, ...todosProds.map(p => Math.max(e1.prods[p] || 0, e2.prods[p] || 0)));

  const barras = todosProds.map(p => {
    const c1 = e1.prods[p] || 0, c2 = e2.prods[p] || 0;
    return `<div style="margin-bottom:10px">
      <div style="font-size:0.85em;font-weight:600;margin-bottom:4px">${esc(p)}</div>
      <div class="bar-row">
        <div class="bar-lbl" style="color:var(--accent)">${esc(lbl1)}</div>
        <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(c1/maxP*100)}%"></div></div>
        <div class="bar-val">×${c1}</div>
      </div>
      <div class="bar-row">
        <div class="bar-lbl" style="color:var(--muted)">${esc(lbl2)}</div>
        <div class="bar-wrap"><div class="bar-fill b2" style="width:${Math.round(c2/maxP*100)}%"></div></div>
        <div class="bar-val">×${c2}</div>
      </div>
    </div>`;
  }).join('');

  const formPersonal = compareMode === 'custom' ? `
    <div class="card">
      <div class="card-title">Período 1</div>
      <div class="range-row">
        <div><label class="input-label">Desde</label>
          <input type="date" value="${esc(infPersonalizado.desde1)}"
            onchange="infPersonalizado.desde1=this.value;refrescarInforme()"></div>
        <div><label class="input-label">Hasta</label>
          <input type="date" value="${esc(infPersonalizado.hasta1)}"
            onchange="infPersonalizado.hasta1=this.value;refrescarInforme()"></div>
      </div>
      <div class="card-title" style="margin-top:6px">Período 2</div>
      <div class="range-row">
        <div><label class="input-label">Desde</label>
          <input type="date" value="${esc(infPersonalizado.desde2)}"
            onchange="infPersonalizado.desde2=this.value;refrescarInforme()"></div>
        <div><label class="input-label">Hasta</label>
          <input type="date" value="${esc(infPersonalizado.hasta2)}"
            onchange="infPersonalizado.hasta2=this.value;refrescarInforme()"></div>
      </div>
    </div>` : '';

  return `
    <div class="compare-tabs">
      <button class="compare-tab ${compareMode==='semanas'?'active':''}" onclick="compareMode='semanas';goTo('informe')">Semanas</button>
      <button class="compare-tab ${compareMode==='meses'?'active':''}" onclick="compareMode='meses';goTo('informe')">Meses</button>
      <button class="compare-tab ${compareMode==='custom'?'active':''}" onclick="compareMode='custom';goTo('informe')">Personalizado</button>
    </div>

    ${formPersonal}

    <div class="stats">
      <div class="stat"><div class="stat-val" style="color:var(--accent)">${fmt(e1.total)}</div><div class="stat-lbl">${esc(lbl1)}</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--muted)">${fmt(e2.total)}</div><div class="stat-lbl">${esc(lbl2)}</div></div>
      <div class="stat"><div class="stat-val">${e1.count}</div><div class="stat-lbl">Ventas (${esc(lbl1.toLowerCase())})</div></div>
      <div class="stat"><div class="stat-val">${e1.clientes.length}</div><div class="stat-lbl">Clientes únicos</div></div>
    </div>

    ${delta !== null ? `
    <div class="card" style="text-align:center;padding:12px">
      <div style="font-size:0.85em;color:var(--muted);margin-bottom:4px">Variación de ingresos</div>
      <div class="stat-val ${delta>=0?'delta-pos':'delta-neg'}">${delta>=0?'▲':'▼'} ${Math.abs(delta)}%</div>
    </div>` : ''}

    ${todosProds.length ? `
    <div class="card">
      <div class="card-title">Comparación por producto</div>
      ${barras}
      <div style="display:flex;gap:14px;margin-top:10px;font-size:0.78em">
        <span style="display:flex;align-items:center;gap:5px">
          <span style="width:12px;height:12px;background:var(--accent);border-radius:3px;display:inline-block"></span>${esc(lbl1)}
        </span>
        <span style="display:flex;align-items:center;gap:5px">
          <span style="width:12px;height:12px;background:var(--card2);border:1.5px solid var(--accent);border-radius:3px;display:inline-block"></span>${esc(lbl2)}
        </span>
      </div>
    </div>` : '<div class="empty"><div class="empty-ico">📊</div>Aún no hay datos suficientes para comparar</div>'}

    <button class="btn btn-secondary" onclick="exportarInforme()">📤 Compartir informe</button>
  `;
}

function refrescarInforme() {
  const el = document.getElementById('app');
  if (el && paginaActual === 'informe') el.innerHTML = renderInforme();
}

function exportarInforme() {
  const { lbl, desde, hasta } = _reporteActual;
  const v = ventasRango(desde, hasta);
  if (!v.length) { toast('No hay ventas en este período', 'red'); return; }
  const e = estadisticas(v);

  const lineas = [
    '📊 INFORME DE VENTAS',
    '📅 ' + lbl + ': ' + fmtFecha(desde) + ' — ' + fmtFecha(hasta),
    '',
    '💰 Total: ' + fmt(e.total),
    '🧾 Ventas: ' + e.count,
    '👥 Clientes: ' + e.clientes.length,
    '',
    'PRODUCTOS:',
    ...Object.entries(e.prods).sort((a,b) => b[1]-a[1]).map(([p,c]) => '• ' + p + ': ×' + c),
    '',
    'DETALLE:',
    ...v.map(vn => fmtFecha(vn.fecha) + ' ' + fmtHora(vn.ts) + ' | ' + vn.cliente + ' | ' + fmt(vn.total))
  ];

  const texto = lineas.join('\n');
  if (navigator.share) {
    navigator.share({ text: texto, title: 'Informe ' + lbl }).catch(() => mostrarExport(texto));
  } else {
    mostrarExport(texto);
  }
}

      <div class="ajuste-row">
        <div><div class="ajuste-lbl">Ventas registradas</div><div class="ajuste-sub">${DB.ventas.length} registros en este dispositivo</div></div>
      </div>
      <div class="ajuste-row" style="border:none">
        <div><div class="ajuste-lbl" style="color:#ff6b8a">Borrar todo</div><div class="ajuste-sub">Elimina todas las ventas permanentemente</div></div>
        <button class="btn-sm" style="background:#3a0020;color:#ff6b8a" onclick="borrarTodo()">Borrar</button>
      </div>
    </div>
  `;
}

function setFS(sz) {
  DB.config.fontSize = sz;
  guardar();
  aplicarFS();
  goTo('ajustes');
}

function addProdCat() {
  const inp = document.getElementById('inp-nuevo-prod');
  if (!inp) return;
  const n = inp.value.trim();
  if (!n) { toast('Escribe un nombre', 'red'); return; }
  if (DB.productos.includes(n)) { toast('Ya existe en el catálogo', 'red'); inp.value = ''; return; }
  DB.productos.push(n);
  guardar();
  inp.value = '';
  // Solo actualizar la lista, no re-renderizar toda la página
  const el = document.getElementById('prod-cat');
  if (el) el.innerHTML = DB.productos.map((p, i) => `
    <div class="prod-cat-item">
      <span>${esc(p)}</span>
      <button class="btn-sm" style="background:#3a0020;color:#ff6b8a" onclick="quitarProdCat(${i})">Quitar</button>
    </div>`).join('');
  toast('Producto agregado');
}

function quitarProdCat(i) {
  const nombre = DB.productos[i];
  if (!confirm('¿Quitar "' + nombre + '" del catálogo?')) return;
  DB.productos.splice(i, 1);
  guardar();
  goTo('ajustes');
}

function addCliCat() {
  const inp = document.getElementById('inp-nuevo-cli');
  if (!inp) return;
  const n = inp.value.trim();
  if (!n) { toast('Escribe un nombre', 'red'); return; }
  if (DB.clientes.includes(n)) { toast('Cliente ya guardado', 'red'); inp.value = ''; return; }
  DB.clientes.push(n);
  guardar();
  inp.value = '';
  const el = document.getElementById('cli-cat');
  if (el) el.innerHTML = DB.clientes.map((c, i) => `
    <div class="prod-cat-item">
      <span>👤 ${esc(c)}</span>
      <button class="btn-sm" style="background:#3a0020;color:#ff6b8a" onclick="quitarCli(${i})">Quitar</button>
    </div>`).join('');
  toast('Cliente guardado');
}

function quitarCli(i) {
  DB.clientes.splice(i, 1);
  guardar();
  goTo('ajustes');
}

function borrarTodo() {
  if (!confirm('¿Borrar TODAS las ventas? Esta acción no se puede deshacer.')) return;
  if (!confirm('Confirma: se eliminarán ' + DB.ventas.length + ' ventas.')) return;
  DB.ventas = [];
  guardar();
  toast('Todos los datos borrados', 'red');
  goTo('hoy');
}

// ─── EXPORTAR TEXTO ───────────────────────────────────────────────────────────
function mostrarExport(texto) {
  exportTextoActual = texto;
  document.getElementById('export-text').textContent = texto;
  openModal('modal-export');
}

function copiarTexto() {
  if (!exportTextoActual) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(exportTextoActual)
      .then(() => toast('¡Copiado!'))
      .catch(() => copiarFallback());
  } else {
    copiarFallback();
  }
}

function copiarFallback() {
  const ta = document.createElement('textarea');
  ta.value = exportTextoActual;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    toast('¡Copiado!');
  } catch (e) {
    toast('No se pudo copiar, selecciónalo manualmente', 'red');
  }
  document.body.removeChild(ta);
}

// ─── RENDER PRINCIPAL ─────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  app.scrollTop = 0;

  if (paginaActual === 'venta')    app.innerHTML = renderVenta();
  else if (paginaActual === 'hoy')     app.innerHTML = renderHoy();
  else if (paginaActual === 'ventas')  app.innerHTML = renderVentas();
  else if (paginaActual === 'informe') app.innerHTML = renderInforme();
  else if (paginaActual === 'ajustes') app.innerHTML = renderAjustes();
}

// ─── INICIO ───────────────────────────────────────────────────────────────────
cargar();
aplicarFS();

const hdrFecha = new Date().toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
const hdrEl = document.getElementById('hdr-date');
if (hdrEl) hdrEl.textContent = hdrFecha.charAt(0).toUpperCase() + hdrFecha.slice(1);

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
