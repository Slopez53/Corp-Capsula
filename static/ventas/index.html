<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mis Ventas</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --fs: 16px;
    --accent: #e94560;
    --bg: #1a1a2e;
    --card: #16213e;
    --card2: #0f3460;
    --text: #eaeaea;
    --muted: #8899aa;
    --green: #00b894;
    --yellow: #fdcb6e;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: var(--fs);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    background: var(--card);
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 2px solid var(--accent);
  }
  .hdr h1 { font-size: 1.1em; font-weight: 700; }
  .hdr-date { font-size: 0.8em; color: var(--muted); }

  /* CONTENT */
  #app { flex: 1; overflow-y: auto; padding: 14px 12px 90px; }

  /* BOTTOM NAV */
  nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--card);
    display: flex;
    border-top: 1px solid #2a2a5e;
    z-index: 20;
  }
  nav button {
    flex: 1;
    border: none;
    background: none;
    color: var(--muted);
    padding: 10px 4px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 0.72em;
    cursor: pointer;
    transition: color .2s;
  }
  nav button.active { color: var(--accent); }
  nav button span.ico { font-size: 1.6em; }

  /* CARDS */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 0.78em;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 10px;
    font-weight: 600;
  }

  /* INPUTS */
  input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid #2a2a5e;
    border-radius: 10px;
    color: var(--text);
    font-size: 1em;
    padding: 12px 14px;
    outline: none;
    -webkit-appearance: none;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  textarea { resize: none; height: 70px; }
  .input-row { margin-bottom: 10px; }
  .input-label { font-size: 0.82em; color: var(--muted); margin-bottom: 5px; display: block; }

  /* BUTTONS */
  .btn {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: opacity .15s;
    font-family: inherit;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--card2); color: var(--text); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-sm {
    padding: 8px 14px;
    font-size: 0.88em;
    border-radius: 8px;
    width: auto;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }

  /* STAT BOXES */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
  }
  .stat-val { font-size: 1.35em; font-weight: 700; color: var(--accent); }
  .stat-lbl { font-size: 0.75em; color: var(--muted); margin-top: 3px; }

  /* VENTA ITEMS */
  .venta-item {
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    border-left: 3px solid var(--accent);
  }
  .venta-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .venta-cliente { font-weight: 700; }
  .venta-total { font-weight: 700; color: var(--green); font-size: 1.05em; }
  .venta-hora { font-size: 0.78em; color: var(--muted); }
  .venta-prods { font-size: 0.83em; color: var(--muted); margin-top: 4px; }
  .venta-btns { display: flex; gap: 6px; margin-top: 8px; }

  /* ITEMS DE PRODUCTOS en el formulario */
  .prod-row {
    display: grid;
    grid-template-columns: 1fr 70px 90px auto;
    gap: 6px;
    align-items: end;
    margin-bottom: 8px;
  }
  .prod-row select, .prod-row input { padding: 10px 8px; font-size: 0.9em; }
  .del-btn {
    border: none;
    background: #3a0020;
    color: #ff6b8a;
    border-radius: 8px;
    padding: 10px 10px;
    font-size: 1em;
    cursor: pointer;
    height: 42px;
  }

  /* INFORME */
  .range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .compare-card { background: var(--card); border-radius: var(--radius); padding: 14px; }
  .compare-head { display: flex; justify-content: space-between; font-size: 0.82em; color: var(--muted); margin-bottom: 10px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.9em; }
  .bar-lbl { width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.88em; }
  .bar-wrap { flex: 1; height: 12px; background: #2a2a5e; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: var(--accent); transition: width .4s; }
  .bar-fill.b2 { background: var(--card2); border: 1.5px solid var(--accent); }
  .bar-val { min-width: 50px; text-align: right; font-size: 0.82em; color: var(--muted); }

  /* CLIENTES */
  .cliente-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .cliente-stats { font-size: 0.8em; color: var(--muted); margin-top: 2px; }

  /* AJUSTES */
  .ajuste-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #2a2a5e;
  }
  .ajuste-row:last-child { border-bottom: none; }
  .ajuste-lbl { font-weight: 500; }
  .ajuste-sub { font-size: 0.8em; color: var(--muted); margin-top: 2px; }
  .fs-btns { display: flex; gap: 6px; }
  .fs-btn {
    border: 1.5px solid #2a2a5e;
    background: none;
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color .2s, background .2s;
  }
  .fs-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }

  /* PROD CATALOG */
  .prod-cat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #2a2a5e;
    font-size: 0.9em;
  }
  .prod-cat-item:last-child { border-bottom: none; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--green);
    color: #fff;
    padding: 10px 24px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.9em;
    opacity: 0;
    transition: opacity .3s, transform .3s;
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* MODAL */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 16px 30px;
    width: 100%;
    max-width: 480px;
    max-height: 85dvh;
    overflow-y: auto;
  }
  .modal-title { font-size: 1.05em; font-weight: 700; margin-bottom: 14px; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 1.3em; cursor: pointer; }

  /* EMPTY STATE */
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9em; }
  .empty-ico { font-size: 3em; margin-bottom: 10px; }

  /* DIVIDER */
  .divider { font-size: 0.78em; color: var(--muted); text-align: center; margin: 14px 0 8px; position: relative; }
  .divider::before, .divider::after { content:''; position:absolute; top:50%; width:30%; height:1px; background:#2a2a5e; }
  .divider::before { left:0; }
  .divider::after { right:0; }

  /* RESUMEN DE VENTA */
  .resumen-prod { display: flex; justify-content: space-between; font-size: 0.9em; padding: 5px 0; border-bottom: 1px solid #2a2a5e; }
  .resumen-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.05em; padding: 10px 0 4px; }
  .tag { display: inline-block; background: var(--card2); border-radius: 6px; padding: 2px 8px; font-size: 0.78em; color: var(--muted); margin-right: 4px; }

  /* Filtro tabs */
  .filter-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
  .filter-tab { border: 1.5px solid #2a2a5e; background: none; color: var(--muted); border-radius: 20px; padding: 6px 14px; font-size: 0.85em; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .filter-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(233,69,96,.1); }

  .section-title { font-size: 1em; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .badge { background: var(--accent); color: #fff; border-radius: 20px; padding: 2px 9px; font-size: 0.78em; }

  /* Comparación */
  .compare-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .compare-tab { flex:1; border:1.5px solid #2a2a5e; background:none; color:var(--muted); border-radius:20px; padding:8px; font-size:0.85em; cursor:pointer; font-family:inherit; text-align:center; }
  .compare-tab.active { border-color:var(--accent); color:var(--accent); background:rgba(233,69,96,.1); }

  .delta-pos { color: var(--green); font-weight: 700; }
  .delta-neg { color: var(--accent); font-weight: 700; }

  .export-area { background: var(--bg); border-radius: 10px; padding: 12px; font-size: 0.8em; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; margin-bottom: 10px; line-height: 1.5; }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>🥩 Mis Ventas</h1>
    <div class="hdr-date" id="hdr-date"></div>
  </div>
  <div style="font-size:1.5em">💰</div>
</div>

<div id="app"></div>

<nav>
  <button class="active" onclick="goTo('venta')" id="nav-venta">
    <span class="ico">➕</span>Nueva Venta
  </button>
  <button onclick="goTo('hoy')" id="nav-hoy">
    <span class="ico">📅</span>Hoy
  </button>
  <button onclick="goTo('ventas')" id="nav-ventas">
    <span class="ico">📋</span>Ventas
  </button>
  <button onclick="goTo('informe')" id="nav-informe">
    <span class="ico">📊</span>Informe
  </button>
  <button onclick="goTo('ajustes')" id="nav-ajustes">
    <span class="ico">⚙️</span>Ajustes
  </button>
</nav>

<div class="toast" id="toast"></div>

<!-- MODAL detalle venta -->
<div class="modal-bg" id="modal-detalle">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-detalle')">✕</button>
    <div class="modal-title">Detalle de Venta</div>
    <div id="modal-detalle-content"></div>
    <div style="margin-top:14px; display:flex; gap:8px;">
      <button class="btn btn-secondary" style="font-size:0.9em" onclick="exportarVenta()">📤 Compartir</button>
      <button class="btn btn-primary" style="font-size:0.9em; background:#c0392b" id="btn-delete-venta">🗑️ Eliminar</button>
    </div>
  </div>
</div>

<!-- MODAL exportar informe -->
<div class="modal-bg" id="modal-export">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-export')">✕</button>
    <div class="modal-title">📤 Compartir Informe</div>
    <div class="export-area" id="export-text"></div>
    <button class="btn btn-primary" onclick="copiarTexto()">📋 Copiar texto</button>
  </div>
</div>

<script>
// ─── ESTADO ───────────────────────────────────────────────────────────────────
let state = {
  ventas: [],
  config: { fontSize: 'medium', moneda: '$' },
  productos: ['Salchichas','Chorizo','Jamón','Mortadela','Salami','Tocino','Longaniza','Butifarra'],
  clientes: []
};

let paginaActual = 'venta';
let ventaDetalleId = null;

// ─── PERSISTENCIA ─────────────────────────────────────────────────────────────
function guardar() {
  localStorage.setItem('embutidos_data', JSON.stringify(state));
}
function cargar() {
  const d = localStorage.getItem('embutidos_data');
  if (d) {
    const parsed = JSON.parse(d);
    state = { ...state, ...parsed };
    if (!state.productos || !state.productos.length) {
      state.productos = ['Salchichas','Chorizo','Jamón','Mortadela','Salami','Tocino','Longaniza','Butifarra'];
    }
    if (!state.clientes) state.clientes = [];
    if (!state.config) state.config = { fontSize: 'medium', moneda: '$' };
  }
}

// ─── FONT SIZE ────────────────────────────────────────────────────────────────
const fsMap = { small: '14px', medium: '16px', large: '19px' };
function aplicarFontSize() {
  document.documentElement.style.setProperty('--fs', fsMap[state.config.fontSize] || '16px');
}

// ─── UTILIDADES ───────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function hoy() { return new Date().toISOString().slice(0,10); }
function fmt(n) { return state.config.moneda + Number(n).toLocaleString('es-CO'); }
function fmtFecha(d) {
  const [y,m,dia] = d.split('-');
  return `${dia}/${m}/${y}`;
}
function fmtHora(ts) {
  return new Date(ts).toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'});
}

function toast(msg, type='green') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type === 'green' ? 'var(--green)' : 'var(--accent)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function openModal(id) { document.getElementById(id).classList.add('open'); }

// ─── NAVEGACIÓN ───────────────────────────────────────────────────────────────
function goTo(p) {
  paginaActual = p;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + p).classList.add('active');
  render();
}

// ─── FORMULARIO NUEVA VENTA ───────────────────────────────────────────────────
let ventaItems = [{ prod: '', cant: 1, precio: 0 }];

function renderVenta() {
  const opts = state.productos.map(p => `<option value="${p}">${p}</option>`).join('');
  const cliOpts = state.clientes.map(c => `<option value="${c}">${c}</option>`).join('');

  const rows = ventaItems.map((it, i) => `
    <div class="prod-row">
      <select onchange="cambiarProd(${i}, this.value)">
        <option value="">— Producto —</option>
        ${opts}
        <option value="__otro">Otro...</option>
      </select>
      <input type="number" inputmode="numeric" min="1" placeholder="Cant" value="${it.cant}"
        onchange="ventaItems[${i}].cant=+this.value; recalcTotal()">
      <input type="number" inputmode="decimal" min="0" placeholder="Precio" value="${it.precio || ''}"
        onchange="ventaItems[${i}].precio=+this.value; recalcTotal()">
      <button class="del-btn" onclick="quitarProd(${i})">✕</button>
    </div>
  `).join('');

  const total = ventaItems.reduce((s,it) => s + it.cant * it.precio, 0);

  return `
    <div class="card">
      <div class="card-title">Cliente</div>
      <div class="input-row">
        <input list="clientes-list" id="input-cliente" placeholder="Nombre del cliente" autocomplete="off">
        <datalist id="clientes-list">${cliOpts}</datalist>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Productos vendidos</div>
      <div id="prod-rows">${rows}</div>
      <button class="btn btn-secondary" style="margin-top:4px" onclick="agregarProd()">＋ Agregar producto</button>
    </div>

    <div class="card">
      <div class="card-title">Nota (opcional)</div>
      <textarea id="input-nota" placeholder="Ej: pago con transferencia, pedido para mañana..."></textarea>
    </div>

    <div class="stat" style="margin-bottom:12px; background:var(--card)">
      <div class="stat-val" id="total-preview">${fmt(total)}</div>
      <div class="stat-lbl">Total de esta venta</div>
    </div>

    <button class="btn btn-primary" onclick="guardarVenta()">✅ Guardar Venta</button>
  `;
}

function cambiarProd(i, val) {
  if (val === '__otro') {
    const n = prompt('Nombre del producto:');
    if (n && n.trim()) {
      if (!state.productos.includes(n.trim())) {
        state.productos.push(n.trim());
        guardar();
      }
      ventaItems[i].prod = n.trim();
    }
  } else {
    ventaItems[i].prod = val;
  }
}

function agregarProd() {
  ventaItems.push({ prod: '', cant: 1, precio: 0 });
  document.getElementById('prod-rows').innerHTML = '';
  goTo('venta');
}

function quitarProd(i) {
  if (ventaItems.length === 1) return;
  ventaItems.splice(i, 1);
  goTo('venta');
}

function recalcTotal() {
  const total = ventaItems.reduce((s,it) => s + it.cant * it.precio, 0);
  const el = document.getElementById('total-preview');
  if (el) el.textContent = fmt(total);
}

function guardarVenta() {
  const cliente = document.getElementById('input-cliente').value.trim() || 'Sin nombre';
  const nota = document.getElementById('input-nota').value.trim();

  // Leer valores actuales de los inputs
  const rows = document.querySelectorAll('#prod-rows .prod-row');
  rows.forEach((row, i) => {
    const sel = row.querySelector('select');
    const cant = row.querySelectorAll('input')[0];
    const precio = row.querySelectorAll('input')[1];
    if (sel) ventaItems[i].prod = sel.value === '__otro' ? ventaItems[i].prod : sel.value;
    if (cant) ventaItems[i].cant = +cant.value || 1;
    if (precio) ventaItems[i].precio = +precio.value || 0;
  });

  const items = ventaItems.filter(it => it.prod && it.precio > 0);
  if (!items.length) { toast('Agrega al menos un producto con precio', 'red'); return; }

  const total = items.reduce((s,it) => s + it.cant * it.precio, 0);

  const venta = {
    id: uid(),
    fecha: hoy(),
    ts: Date.now(),
    cliente,
    nota,
    items,
    total
  };

  state.ventas.unshift(venta);
  if (!state.clientes.includes(cliente) && cliente !== 'Sin nombre') {
    state.clientes.push(cliente);
  }
  guardar();

  ventaItems = [{ prod: '', cant: 1, precio: 0 }];
  toast('¡Venta guardada! ' + fmt(total));
  goTo('hoy');
}

// ─── HOY ──────────────────────────────────────────────────────────────────────
function renderHoy() {
  const ventasHoy = state.ventas.filter(v => v.fecha === hoy());
  const total = ventasHoy.reduce((s,v) => s + v.total, 0);
  const clientes = [...new Set(ventasHoy.map(v => v.cliente))].length;

  // Top productos hoy
  const prods = {};
  ventasHoy.forEach(v => v.items.forEach(it => {
    prods[it.prod] = (prods[it.prod] || 0) + it.cant;
  }));
  const topProds = Object.entries(prods).sort((a,b) => b[1]-a[1]).slice(0,5);

  const listaVentas = ventasHoy.map(v => ventaCard(v)).join('') || '<div class="empty"><div class="empty-ico">📭</div>Aún no hay ventas hoy</div>';

  return `
    <div class="stats">
      <div class="stat">
        <div class="stat-val">${fmt(total)}</div>
        <div class="stat-lbl">Vendido hoy</div>
      </div>
      <div class="stat">
        <div class="stat-val">${ventasHoy.length}</div>
        <div class="stat-lbl">Ventas</div>
      </div>
      <div class="stat">
        <div class="stat-val">${clientes}</div>
        <div class="stat-lbl">Clientes</div>
      </div>
      <div class="stat">
        <div class="stat-val">${Object.keys(prods).length}</div>
        <div class="stat-lbl">Productos</div>
      </div>
    </div>

    ${topProds.length ? `
    <div class="card">
      <div class="card-title">Más vendido hoy</div>
      ${topProds.map(([p,c]) => `<div class="prod-cat-item"><span>${p}</span><span class="tag">×${c}</span></div>`).join('')}
    </div>` : ''}

    <div class="section-title">Ventas de hoy <span class="badge">${ventasHoy.length}</span></div>
    ${listaVentas}
  `;
}

// ─── LISTA VENTAS ─────────────────────────────────────────────────────────────
let filtroVentas = 'hoy';
let buscaCliente = '';

function renderVentas() {
  let lista = [...state.ventas];
  const ahora = new Date();

  if (buscaCliente) {
    lista = lista.filter(v => v.cliente.toLowerCase().includes(buscaCliente.toLowerCase()));
  } else {
    if (filtroVentas === 'hoy') lista = lista.filter(v => v.fecha === hoy());
    else if (filtroVentas === 'semana') {
      const lun = new Date(ahora); lun.setDate(ahora.getDate() - ahora.getDay() + 1);
      lista = lista.filter(v => new Date(v.fecha) >= lun);
    } else if (filtroVentas === 'mes') {
      const mes = hoy().slice(0,7);
      lista = lista.filter(v => v.fecha.startsWith(mes));
    }
  }

  const totalFiltro = lista.reduce((s,v) => s + v.total, 0);
  const items = lista.map(v => ventaCard(v)).join('') || '<div class="empty"><div class="empty-ico">📭</div>No hay ventas en este período</div>';

  return `
    <div class="input-row">
      <input type="search" placeholder="🔍 Buscar por cliente..." value="${buscaCliente}"
        oninput="buscaCliente=this.value; document.getElementById('ventas-list').innerHTML=renderVentasList()">
    </div>

    <div class="filter-tabs">
      <button class="filter-tab ${filtroVentas==='hoy'?'active':''}" onclick="setFiltro('hoy')">Hoy</button>
      <button class="filter-tab ${filtroVentas==='semana'?'active':''}" onclick="setFiltro('semana')">Esta semana</button>
      <button class="filter-tab ${filtroVentas==='mes'?'active':''}" onclick="setFiltro('mes')">Este mes</button>
      <button class="filter-tab ${filtroVentas==='todo'?'active':''}" onclick="setFiltro('todo')">Todo</button>
    </div>

    ${lista.length ? `<div class="stat" style="background:var(--card); margin-bottom:12px; text-align:center; padding:12px">
      <span style="font-weight:700; color:var(--green); font-size:1.1em">${fmt(totalFiltro)}</span>
      <span style="color:var(--muted); font-size:0.82em; margin-left:8px">${lista.length} venta${lista.length!==1?'s':''}</span>
    </div>` : ''}

    <div id="ventas-list">${items}</div>
  `;
}

function renderVentasList() {
  let lista = [...state.ventas];
  const ahora = new Date();
  if (buscaCliente) {
    lista = lista.filter(v => v.cliente.toLowerCase().includes(buscaCliente.toLowerCase()));
  } else {
    if (filtroVentas === 'hoy') lista = lista.filter(v => v.fecha === hoy());
    else if (filtroVentas === 'semana') {
      const lun = new Date(ahora); lun.setDate(ahora.getDate() - ahora.getDay() + 1);
      lista = lista.filter(v => new Date(v.fecha) >= lun);
    } else if (filtroVentas === 'mes') {
      const mes = hoy().slice(0,7);
      lista = lista.filter(v => v.fecha.startsWith(mes));
    }
  }
  return lista.map(v => ventaCard(v)).join('') || '<div class="empty"><div class="empty-ico">📭</div>No hay ventas</div>';
}

function setFiltro(f) {
  filtroVentas = f;
  buscaCliente = '';
  goTo('ventas');
}

function ventaCard(v) {
  const prodsStr = v.items.map(it => `${it.prod} ×${it.cant}`).join(', ');
  return `
    <div class="venta-item" onclick="verDetalle('${v.id}')">
      <div class="venta-top">
        <span class="venta-cliente">👤 ${v.cliente}</span>
        <span class="venta-total">${fmt(v.total)}</span>
      </div>
      <div class="venta-hora">${fmtFecha(v.fecha)} · ${fmtHora(v.ts)}</div>
      <div class="venta-prods">${prodsStr}</div>
    </div>
  `;
}

function verDetalle(id) {
  const v = state.ventas.find(x => x.id === id);
  if (!v) return;
  ventaDetalleId = id;
  const content = `
    <div style="margin-bottom:10px">
      <div style="font-size:1.05em; font-weight:700; margin-bottom:2px">👤 ${v.cliente}</div>
      <div style="color:var(--muted); font-size:0.82em">${fmtFecha(v.fecha)} · ${fmtHora(v.ts)}</div>
    </div>
    ${v.items.map(it => `
      <div class="resumen-prod">
        <span>${it.prod} <span class="tag">×${it.cant}</span></span>
        <span>${fmt(it.cant * it.precio)}</span>
      </div>
    `).join('')}
    <div class="resumen-total">
      <span>Total</span>
      <span style="color:var(--green)">${fmt(v.total)}</span>
    </div>
    ${v.nota ? `<div style="margin-top:10px; font-size:0.85em; color:var(--muted)">📝 ${v.nota}</div>` : ''}
  `;
  document.getElementById('modal-detalle-content').innerHTML = content;
  document.getElementById('btn-delete-venta').onclick = () => eliminarVenta(id);
  openModal('modal-detalle');
}

function eliminarVenta(id) {
  if (!confirm('¿Eliminar esta venta?')) return;
  state.ventas = state.ventas.filter(v => v.id !== id);
  guardar();
  closeModal('modal-detalle');
  toast('Venta eliminada', 'red');
  render();
}

function exportarVenta() {
  const v = state.ventas.find(x => x.id === ventaDetalleId);
  if (!v) return;
  const lines = [
    `📦 VENTA - ${fmtFecha(v.fecha)}`,
    `👤 Cliente: ${v.cliente}`,
    `⏰ Hora: ${fmtHora(v.ts)}`,
    ``,
    ...v.items.map(it => `• ${it.prod} ×${it.cant} = ${fmt(it.cant * it.precio)}`),
    ``,
    `💰 TOTAL: ${fmt(v.total)}`,
    v.nota ? `📝 ${v.nota}` : ''
  ].filter(l => l !== undefined);

  const txt = lines.join('\n');
  if (navigator.share) {
    navigator.share({ text: txt, title: 'Venta ' + v.cliente });
  } else {
    document.getElementById('export-text').textContent = txt;
    closeModal('modal-detalle');
    openModal('modal-export');
  }
}

// ─── INFORME ──────────────────────────────────────────────────────────────────
let compareMode = 'semanas';
let inf = { desde1: '', hasta1: '', desde2: '', hasta2: '' };

function ventasEnRango(desde, hasta) {
  return state.ventas.filter(v => v.fecha >= desde && v.fecha <= hasta);
}

function estadisticasRango(ventas) {
  const total = ventas.reduce((s,v) => s + v.total, 0);
  const clientes = [...new Set(ventas.map(v => v.cliente))];
  const prods = {};
  ventas.forEach(v => v.items.forEach(it => {
    prods[it.prod] = (prods[it.prod] || 0) + it.cant;
  }));
  return { total, ventas: ventas.length, clientes, prods };
}

function semanaActual() {
  const hoyD = new Date();
  const lun = new Date(hoyD); lun.setDate(hoyD.getDate() - ((hoyD.getDay()+6)%7));
  const dom = new Date(lun); dom.setDate(lun.getDate() + 6);
  return [lun.toISOString().slice(0,10), dom.toISOString().slice(0,10)];
}
function semanaPasada() {
  const [lun] = semanaActual();
  const l2 = new Date(lun); l2.setDate(l2.getDate() - 7);
  const d2 = new Date(l2); d2.setDate(l2.getDate() + 6);
  return [l2.toISOString().slice(0,10), d2.toISOString().slice(0,10)];
}
function mesActual() {
  const m = hoy().slice(0,7);
  return [m+'-01', m+'-31'];
}
function mesPasado() {
  const d = new Date(); d.setMonth(d.getMonth() - 1);
  const m = d.toISOString().slice(0,7);
  return [m+'-01', m+'-31'];
}

function renderInforme() {
  let r1, r2, lbl1, lbl2;
  if (compareMode === 'semanas') {
    [r1, r2] = [semanaActual(), semanaPasada()];
    lbl1 = 'Esta semana'; lbl2 = 'Semana pasada';
  } else if (compareMode === 'meses') {
    [r1, r2] = [mesActual(), mesPasado()];
    lbl1 = 'Este mes'; lbl2 = 'Mes pasado';
  } else {
    r1 = [inf.desde1 || hoy(), inf.hasta1 || hoy()];
    r2 = [inf.desde2 || hoy(), inf.hasta2 || hoy()];
    lbl1 = 'Período 1'; lbl2 = 'Período 2';
  }

  const v1 = ventasEnRango(r1[0], r1[1]);
  const v2 = ventasEnRango(r2[0], r2[1]);
  const e1 = estadisticasRango(v1);
  const e2 = estadisticasRango(v2);

  const deltaTotal = e2.total > 0 ? Math.round((e1.total - e2.total) / e2.total * 100) : null;
  const deltaVentas = e2.ventas > 0 ? Math.round((e1.ventas - e2.ventas) / e2.ventas * 100) : null;

  // Top productos combinados
  const allProds = {};
  [...Object.keys(e1.prods), ...Object.keys(e2.prods)].forEach(p => allProds[p] = true);
  const prodNames = Object.keys(allProds).slice(0,6);
  const maxProd = Math.max(...prodNames.map(p => Math.max(e1.prods[p]||0, e2.prods[p]||0)), 1);

  const barras = prodNames.map(p => {
    const c1 = e1.prods[p] || 0, c2 = e2.prods[p] || 0;
    return `
      <div style="margin-bottom:10px">
        <div style="font-size:0.85em; margin-bottom:4px; font-weight:600">${p}</div>
        <div class="bar-row">
          <div class="bar-lbl" style="color:var(--accent)">${lbl1}</div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${(c1/maxProd*100).toFixed(0)}%"></div></div>
          <div class="bar-val">×${c1}</div>
        </div>
        <div class="bar-row">
          <div class="bar-lbl" style="color:var(--muted)">${lbl2}</div>
          <div class="bar-wrap"><div class="bar-fill b2" style="width:${(c2/maxProd*100).toFixed(0)}%"></div></div>
          <div class="bar-val">×${c2}</div>
        </div>
      </div>
    `;
  }).join('');

  const customForm = compareMode === 'custom' ? `
    <div class="card">
      <div class="card-title">Período 1</div>
      <div class="range-row">
        <div class="input-row"><label class="input-label">Desde</label>
          <input type="date" value="${inf.desde1}" onchange="inf.desde1=this.value; actualizarInforme()"></div>
        <div class="input-row"><label class="input-label">Hasta</label>
          <input type="date" value="${inf.hasta1}" onchange="inf.hasta1=this.value; actualizarInforme()"></div>
      </div>
      <div class="card-title" style="margin-top:8px">Período 2</div>
      <div class="range-row">
        <div class="input-row"><label class="input-label">Desde</label>
          <input type="date" value="${inf.desde2}" onchange="inf.desde2=this.value; actualizarInforme()"></div>
        <div class="input-row"><label class="input-label">Hasta</label>
          <input type="date" value="${inf.hasta2}" onchange="inf.hasta2=this.value; actualizarInforme()"></div>
      </div>
    </div>
  ` : '';

  return `
    <div class="compare-tabs">
      <button class="compare-tab ${compareMode==='semanas'?'active':''}" onclick="compareMode='semanas';goTo('informe')">Semanas</button>
      <button class="compare-tab ${compareMode==='meses'?'active':''}" onclick="compareMode='meses';goTo('informe')">Meses</button>
      <button class="compare-tab ${compareMode==='custom'?'active':''}" onclick="compareMode='custom';goTo('informe')">Personalizado</button>
    </div>

    ${customForm}

    <div class="stats">
      <div class="stat">
        <div class="stat-val" style="color:var(--accent)">${fmt(e1.total)}</div>
        <div class="stat-lbl">${lbl1}</div>
      </div>
      <div class="stat">
        <div class="stat-val" style="color:var(--muted)">${fmt(e2.total)}</div>
        <div class="stat-lbl">${lbl2}</div>
      </div>
      <div class="stat">
        <div class="stat-val">${e1.ventas}</div>
        <div class="stat-lbl">Ventas (${lbl1.toLowerCase()})</div>
      </div>
      <div class="stat">
        <div class="stat-val">${e1.clientes.length}</div>
        <div class="stat-lbl">Clientes únicos</div>
      </div>
    </div>

    ${deltaTotal !== null ? `
    <div class="card" style="text-align:center; padding:12px">
      <div style="font-size:0.85em; color:var(--muted); margin-bottom:4px">Variación de ingresos</div>
      <div class="stat-val ${deltaTotal >= 0 ? 'delta-pos' : 'delta-neg'}">${deltaTotal >= 0 ? '▲' : '▼'} ${Math.abs(deltaTotal)}%</div>
    </div>` : ''}

    ${prodNames.length ? `
    <div class="card">
      <div class="card-title">Comparación por producto</div>
      ${barras}
      <div style="display:flex; gap:10px; margin-top:8px; font-size:0.78em">
        <span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:12px;height:12px;background:var(--accent);border-radius:3px"></span>${lbl1}</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:12px;height:12px;background:var(--card2);border:1.5px solid var(--accent);border-radius:3px"></span>${lbl2}</span>
      </div>
    </div>` : '<div class="empty"><div class="empty-ico">📊</div>Aún no hay datos para comparar</div>'}

    <button class="btn btn-secondary" onclick="exportarInforme('${lbl1}','${r1[0]}','${r1[1]}')">📤 Compartir informe de ${lbl1.toLowerCase()}</button>
  `;
}

function actualizarInforme() {
  document.getElementById('app').innerHTML = renderInforme();
}

function exportarInforme(lbl, desde, hasta) {
  const v = ventasEnRango(desde, hasta);
  const e = estadisticasRango(v);
  const lines = [
    `📊 INFORME DE VENTAS`,
    `📅 ${lbl}: ${fmtFecha(desde)} — ${fmtFecha(hasta)}`,
    ``,
    `💰 Total: ${fmt(e.total)}`,
    `🧾 Ventas: ${e.ventas}`,
    `👥 Clientes: ${e.clientes.length}`,
    ``,
    `PRODUCTOS:`,
    ...Object.entries(e.prods).sort((a,b)=>b[1]-a[1]).map(([p,c]) => `• ${p}: ×${c}`),
    ``,
    `DETALLE:`,
    ...v.map(vn => `${fmtFecha(vn.fecha)} ${fmtHora(vn.ts)} | ${vn.cliente} | ${fmt(vn.total)}`)
  ];
  const txt = lines.join('\n');
  if (navigator.share) {
    navigator.share({ text: txt, title: 'Informe de ventas' });
  } else {
    document.getElementById('export-text').textContent = txt;
    openModal('modal-export');
  }
}

// ─── AJUSTES ──────────────────────────────────────────────────────────────────
let nuevoProd = '';
let nuevoCli = '';

function renderAjustes() {
  const prodList = state.productos.map((p, i) => `
    <div class="prod-cat-item">
      <span>${p}</span>
      <button class="btn-sm" style="background:#3a0020;color:#ff6b8a" onclick="eliminarProd(${i})">Quitar</button>
    </div>
  `).join('');

  const cliList = state.clientes.map((c, i) => `
    <div class="prod-cat-item">
      <span>👤 ${c}</span>
      <button class="btn-sm" style="background:#3a0020;color:#ff6b8a" onclick="eliminarCli(${i})">Quitar</button>
    </div>
  `).join('') || '<div style="color:var(--muted);font-size:0.85em;padding:8px 0">Se agregan automáticamente al guardar ventas</div>';

  return `
    <div class="card">
      <div class="card-title">Tamaño de letra</div>
      <div class="ajuste-row" style="border:none;padding:0">
        <div>
          <div class="ajuste-lbl">Ajustar tamaño</div>
          <div class="ajuste-sub">Cambia el tamaño de todo el texto</div>
        </div>
        <div class="fs-btns">
          <button class="fs-btn ${state.config.fontSize==='small'?'active':''}" onclick="setFs('small')" style="font-size:0.8em">A</button>
          <button class="fs-btn ${state.config.fontSize==='medium'?'active':''}" onclick="setFs('medium')" style="font-size:1em">A</button>
          <button class="fs-btn ${state.config.fontSize==='large'?'active':''}" onclick="setFs('large')" style="font-size:1.3em">A</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Moneda / Símbolo</div>
      <input type="text" maxlength="4" placeholder="$" value="${state.config.moneda}"
        oninput="state.config.moneda=this.value;guardar()">
    </div>

    <div class="card">
      <div class="card-title">Catálogo de productos</div>
      <div id="prod-list">${prodList}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input type="text" id="input-nuevo-prod" placeholder="Nombre del producto" style="flex:1"
          onkeypress="if(event.key==='Enter')agregarNuevoProd()">
        <button class="btn-sm btn-green" onclick="agregarNuevoProd()">＋</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Clientes guardados</div>
      <div id="cli-list">${cliList}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input type="text" id="input-nuevo-cli" placeholder="Nombre del cliente" style="flex:1"
          onkeypress="if(event.key==='Enter')agregarNuevoCli()">
        <button class="btn-sm btn-green" onclick="agregarNuevoCli()">＋</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Datos</div>
      <div class="ajuste-row">
        <div><div class="ajuste-lbl">Total de ventas</div><div class="ajuste-sub">${state.ventas.length} registros guardados</div></div>
      </div>
      <div class="ajuste-row" style="border:none">
        <div><div class="ajuste-lbl" style="color:#ff6b8a">Borrar todos los datos</div><div class="ajuste-sub">Esta acción no se puede deshacer</div></div>
        <button class="btn-sm" style="background:#3a0020;color:#ff6b8a" onclick="borrarTodo()">Borrar</button>
      </div>
    </div>
  `;
}

function setFs(sz) {
  state.config.fontSize = sz;
  guardar();
  aplicarFontSize();
  goTo('ajustes');
}

function agregarNuevoProd() {
  const inp = document.getElementById('input-nuevo-prod');
  const n = inp.value.trim();
  if (!n) return;
  if (!state.productos.includes(n)) { state.productos.push(n); guardar(); }
  inp.value = '';
  document.getElementById('prod-list').innerHTML = state.productos.map((p,i)=>`
    <div class="prod-cat-item">
      <span>${p}</span>
      <button class="btn-sm" style="background:#3a0020;color:#ff6b8a" onclick="eliminarProd(${i})">Quitar</button>
    </div>`).join('');
  toast('Producto agregado');
}

function eliminarProd(i) {
  state.productos.splice(i, 1);
  guardar();
  goTo('ajustes');
}

function agregarNuevoCli() {
  const inp = document.getElementById('input-nuevo-cli');
  const n = inp.value.trim();
  if (!n) return;
  if (!state.clientes.includes(n)) { state.clientes.push(n); guardar(); }
  inp.value = '';
  goTo('ajustes');
  toast('Cliente guardado');
}

function eliminarCli(i) {
  state.clientes.splice(i, 1);
  guardar();
  goTo('ajustes');
}

function borrarTodo() {
  if (!confirm('¿Borrar TODOS los datos? Esto eliminará todas las ventas.')) return;
  if (!confirm('¿Confirmar? No hay forma de recuperar los datos.')) return;
  state.ventas = [];
  state.clientes = [];
  guardar();
  toast('Datos borrados', 'red');
  goTo('hoy');
}

function copiarTexto() {
  const txt = document.getElementById('export-text').textContent;
  navigator.clipboard.writeText(txt).then(() => toast('¡Copiado!')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('¡Copiado!');
  });
}

// ─── RENDER PRINCIPAL ─────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.scrollTop = 0;
  if (paginaActual === 'venta') app.innerHTML = renderVenta();
  else if (paginaActual === 'hoy') app.innerHTML = renderHoy();
  else if (paginaActual === 'ventas') app.innerHTML = renderVentas();
  else if (paginaActual === 'informe') app.innerHTML = renderInforme();
  else if (paginaActual === 'ajustes') app.innerHTML = renderAjustes();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
cargar();
aplicarFontSize();

const fechaHoy = new Date().toLocaleDateString('es', {weekday:'long', day:'numeric', month:'long'});
document.getElementById('hdr-date').textContent = fechaHoy.charAt(0).toUpperCase() + fechaHoy.slice(1);

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Cerrar modales al tocar fondo
document.querySelectorAll('.modal-bg').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});
</script>
