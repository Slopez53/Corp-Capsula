name: corp_capsula
description: "Corp Capsula — sistema de gestión integral para panadería (offline-first)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (offline-first, typed SQLite)
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Filesystem / paths
  path_provider: ^2.1.4
  path: ^1.9.0

  # Formatting (currency, dates) — money stays in integer cents internally
  intl: ^0.20.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
